name: CI
on:
  push:
    branches: [ "main" ]
  pull_request: ~
  # Run by the Release workflow before releasing a tag
  workflow_call: ~
jobs:
  cs-check:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v5
      - name: setup
        uses: castor-php/setup-castor@v1.1.0
      - name: 'PHP-CS-Fixer check'
        run: 'castor qa:cs:check'
  phpstan:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v5
      - name: setup
        uses: shivammathur/setup-php@2.37.2
        with:
          php-version: 8.4
          coverage: none
      - name: composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"
      - name: composer cache
        uses: actions/cache@v5
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-phpstan-${{ hashFiles('composer.json') }}
          restore-keys: composer-phpstan-
      - name: composer install
        run: composer update --prefer-stable
      - name: setup
        uses: castor-php/setup-castor@v1.1.0
      - name: 'PHPStan check'
        run: 'castor qa:phpstan'
  tests:
    runs-on: ubuntu-latest
    name: 'tests (PHP ${{ matrix.php-versions }}, ${{ matrix.dependencies }} deps)'
    strategy:
      fail-fast: false
      matrix:
        php-versions:
          - 8.4
          - 8.5
        dependencies:
          - highest
        include:
          # Catches requirements declared lower than what the code actually needs.
          - php-versions: 8.4
            dependencies: lowest
    steps:
      - name: checkout
        uses: actions/checkout@v5
      - name: setup
        uses: shivammathur/setup-php@2.37.2
        with:
          php-version: '${{ matrix.php-versions }}'
          coverage: none
      - name: composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"
      - name: composer cache
        uses: actions/cache@v5
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ matrix.php-versions }}-${{ matrix.dependencies }}-${{ hashFiles('composer.json') }}
          restore-keys: composer-${{ matrix.php-versions }}-${{ matrix.dependencies }}-
      - name: composer install
        run: composer update --prefer-stable ${{ matrix.dependencies == 'lowest' && '--prefer-lowest' || '' }}
      - name: tests
        run: vendor/bin/phpunit
  integration:
    runs-on: ubuntu-latest
    name: 'integration (Data API Builder, Hasura, PostGraphile)'
    steps:
      - name: checkout
        uses: actions/checkout@v5
      - name: setup
        uses: shivammathur/setup-php@2.37.2
        with:
          php-version: 8.4
          coverage: none
      - name: composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"
      - name: composer cache
        uses: actions/cache@v5
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-integration-${{ hashFiles('composer.json') }}
          restore-keys: composer-integration-
      - name: composer install
        run: composer update --prefer-stable
      - name: start the GraphQL servers
        run: docker compose -f tests/Integration/compose.yaml up -d
      # A started container is not a ready server: wait until each one answers a GraphQL query.
      - name: wait for the GraphQL servers
        run: |
          for endpoint in http://127.0.0.1:5000/graphql http://127.0.0.1:8080/v1/graphql http://127.0.0.1:5001/graphql; do
            ready=false
            for _ in $(seq 1 60); do
              if curl -sf -X POST "$endpoint" -H 'Content-Type: application/json' -d '{"query":"{ __typename }"}' > /dev/null; then
                ready=true
                break
              fi
              sleep 2
            done
            [ "$ready" = true ] || { echo "$endpoint is not ready"; exit 1; }
          done
      - name: tests
        run: vendor/bin/phpunit --group integration
        env:
          GRAPHQL_ORM_DAB_ENDPOINT: http://127.0.0.1:5000/graphql
          GRAPHQL_ORM_HASURA_ENDPOINT: http://127.0.0.1:8080/v1/graphql
          GRAPHQL_ORM_POSTGRAPHILE_ENDPOINT: http://127.0.0.1:5001/graphql
      - name: GraphQL servers logs
        if: failure()
        run: docker compose -f tests/Integration/compose.yaml logs
  # The site is published from main by the Documentation workflow: building it here tells a broken page before.
  docs:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v5
      - name: setup node
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - name: install VitePress
        run: npm ci
        working-directory: docs
      - name: build the site
        run: npx vitepress build
        working-directory: docs
