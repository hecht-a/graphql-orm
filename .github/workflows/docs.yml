name: Documentation
on:
  push:
    # Each version is published from its branch: a change to either rebuilds both.
    branches: [ main, 4.x ]
    paths:
      - 'docs/**'
      - 'CHANGELOG.md'
      - '.github/workflows/docs.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
# One deployment at a time, the latest one winning.
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # The whole history, for the "last updated" date of each page.
      - name: checkout
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - name: setup node
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - name: install VitePress
        run: npm ci
        working-directory: docs
      - name: build the site
        run: npx vitepress build
        working-directory: docs
      # The documentation of 4.x, from its branch, served under /4.x/
      - name: checkout 4.x
        uses: actions/checkout@v5
        with:
          ref: 4.x
          path: v4
          fetch-depth: 0
      - name: install VitePress for 4.x
        run: npm ci
        working-directory: v4/docs
      - name: build the site of 4.x
        run: npx vitepress build --base /graphql-orm/4.x/ --outDir "$GITHUB_WORKSPACE/docs/.vitepress/dist/4.x"
        working-directory: v4/docs
      - name: configure pages
        uses: actions/configure-pages@v6.0.0
      - name: upload the site
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: docs/.vitepress/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1
