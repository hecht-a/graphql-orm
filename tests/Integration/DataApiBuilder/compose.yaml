# Throwaway Data API Builder + PostgreSQL stack for the integration tests (see CONTRIBUTING.md).
# The credentials only protect a local test database holding fictitious data.
services:
    database:
        image: postgres:17.11-alpine
        environment:
            POSTGRES_DB: graphql_orm
            POSTGRES_USER: graphql_orm
            POSTGRES_PASSWORD: graphql_orm
        volumes:
            - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
        healthcheck:
            test: ['CMD', 'pg_isready', '-d', 'graphql_orm', '-U', 'graphql_orm']
            interval: 2s
            timeout: 5s
            retries: 30

    dab:
        image: mcr.microsoft.com/azure-databases/data-api-builder:2.0.12
        depends_on:
            database:
                condition: service_healthy
        environment:
            DAB_CONNECTION_STRING: 'Host=database;Port=5432;Database=graphql_orm;Username=graphql_orm;Password=graphql_orm'
        volumes:
            - ./dab-config.json:/App/dab-config.json:ro
        ports:
            - '5000:5000'
