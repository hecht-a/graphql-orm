# Throwaway GraphQL servers for the integration tests (see CONTRIBUTING.md), all backed by the same PostgreSQL
# database holding fictitious data. The credentials only protect this local test database.
services:
    database:
        image: postgres:17.11-alpine
        environment:
            POSTGRES_DB: graphql_orm
            POSTGRES_USER: graphql_orm
            POSTGRES_PASSWORD: graphql_orm
        volumes:
            - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
        healthcheck:
            test: ['CMD', 'pg_isready', '-d', 'graphql_orm', '-U', 'graphql_orm']
            interval: 2s
            timeout: 5s
            retries: 30

    # DataApiBuilderDialect
    dab:
        image: mcr.microsoft.com/azure-databases/data-api-builder:2.0.12
        # No arm64 image: emulated on Apple Silicon
        platform: linux/amd64
        depends_on:
            database:
                condition: service_healthy
        environment:
            DAB_CONNECTION_STRING: 'Host=database;Port=5432;Database=graphql_orm;Username=graphql_orm;Password=graphql_orm'
        volumes:
            - ./DataApiBuilder/dab-config.json:/App/dab-config.json:ro
        ports:
            - '${GRAPHQL_ORM_DAB_PORT:-5000}:5000'

    # HasuraDialect: the metadata (tracked tables, relationships) is applied on startup
    hasura:
        image: hasura/graphql-engine:v2.51.0.cli-migrations-v3
        # No arm64 image of this variant: emulated on Apple Silicon, where the engine may not start
        platform: linux/amd64
        depends_on:
            database:
                condition: service_healthy
        environment:
            HASURA_GRAPHQL_DATABASE_URL: 'postgres://graphql_orm:graphql_orm@database:5432/graphql_orm'
            HASURA_GRAPHQL_ENABLE_CONSOLE: 'false'
            HASURA_GRAPHQL_ENABLE_TELEMETRY: 'false'
        volumes:
            - ./Hasura/metadata:/hasura-metadata:ro
        ports:
            - '${GRAPHQL_ORM_HASURA_PORT:-8080}:8080'

    # RelayDialect (connections) and DefaultDialect (simple lists)
    postgraphile:
        image: graphile/postgraphile:4.14.1
        depends_on:
            database:
                condition: service_healthy
        command:
            - --connection
            - postgres://graphql_orm:graphql_orm@database:5432/graphql_orm
            - --schema
            - public
            - --host
            - 0.0.0.0
            - --port
            - '5000'
            - --simple-collections
            - both
        ports:
            - '${GRAPHQL_ORM_POSTGRAPHILE_PORT:-5001}:5000'
